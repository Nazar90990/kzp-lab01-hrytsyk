name: Java CI

on:
  push:
  pull_request:
    branches:
      - lab-01-java
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify and package on Unix
      if: runner.os != 'Windows'
      run: ./mvnw -B "-Dci.build.number=${{ github.run_number }}" clean verify package

    - name: Verify and package on Windows
      if: runner.os == 'Windows'
      run: .\mvnw.cmd -B "-Dci.build.number=${{ github.run_number }}" clean verify package

    - name: Check version output
      shell: bash
      run: java -Dci.build.number=${{ github.run_number }} -jar target/lab01-1.0.0.jar --version

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lab01-jar-${{ matrix.os }}-build-${{ github.run_number }}
        path: target/lab01-1.0.0.jar
        if-no-files-found: error